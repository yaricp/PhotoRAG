name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --require ./scripts/crypto-polyfill.cjs ./node_modules/.bin/vitest run

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/ -v

  build-appimage-x64:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies for electron-builder
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Download Linux x86_64 Python runtime
        run: bash scripts/download-python-linux.sh x64

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build x86_64 AppImage
        working-directory: frontend
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AppImage was produced
        run: |
          APP=$(find frontend/dist-electron -name "*x64*.AppImage" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No x64 .AppImage found in frontend/dist-electron/"
            ls -la frontend/dist-electron/ || true
            exit 1
          fi
          echo "AppImage: $APP ($(du -sh "$APP" | cut -f1))"

      - name: Run bundle structure assertions
        run: bash scripts/test-bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRAG-Linux-x86_64
          path: frontend/dist-electron/*x64*.AppImage
          retention-days: 14

  build-appimage-arm64:
    name: Build Linux ARM64 AppImage
    runs-on: ubuntu-24.04-arm
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies for electron-builder
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Download Linux ARM64 Python runtime
        run: bash scripts/download-python-linux.sh arm64

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build ARM64 AppImage
        working-directory: frontend
        run: npm run dist:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AppImage was produced
        run: |
          APP=$(find frontend/dist-electron -name "*arm64*.AppImage" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No arm64 .AppImage found in frontend/dist-electron/"
            ls -la frontend/dist-electron/ || true
            exit 1
          fi
          echo "AppImage: $APP ($(du -sh "$APP" | cut -f1))"

      - name: Run bundle structure assertions
        run: bash scripts/test-bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRAG-Linux-arm64
          path: frontend/dist-electron/*arm64*.AppImage
          retention-days: 14
