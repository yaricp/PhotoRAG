name: Build installers

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (e.g. photorag-v0.1.1). Leave blank to skip upload.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cleanup-old-releases:
    name: Delete installer binaries from old releases
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the current and previous release's binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          ALL_RELEASES=$(gh release list --json tagName,publishedAt)

          OTHERS=$(echo "$ALL_RELEASES" | jq -r --arg current "$CURRENT_TAG" \
            'map(select(.tagName != $current)) | sort_by(.publishedAt) | reverse | .[].tagName')

          if [ -z "$OTHERS" ]; then
            echo "No other releases exist — nothing to do."
            exit 0
          fi

          PROTECTED_PREVIOUS=$(echo "$OTHERS" | head -1)
          echo "Current release: $CURRENT_TAG"
          echo "Protected previous release: $PROTECTED_PREVIOUS"

          TO_CLEAN=$(echo "$OTHERS" | tail -n +2)
          if [ -z "$TO_CLEAN" ]; then
            echo "Only one other release exists — nothing older to clean."
            exit 0
          fi

          echo "$TO_CLEAN" | while read -r tag; do
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if [ -z "$assets" ]; then
              echo "$tag: no assets to delete"
              continue
            fi
            echo "$assets" | while read -r asset; do
              echo "Deleting $asset from release $tag"
              gh release delete-asset "$tag" "$asset" -y
            done
          done

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-universal
            os: macos-latest
            script: dist:mac
            artifact-name: PhotoRAG-macOS-universal
            artifact-pattern: frontend/dist-electron/*.dmg

          - name: win-x64
            os: windows-latest
            script: dist:win
            artifact-name: PhotoRAG-Windows-x64
            artifact-pattern: frontend/dist-electron/*x64*.exe

          - name: win-arm64
            os: windows-latest
            script: dist:win:arm64
            artifact-name: PhotoRAG-Windows-arm64
            artifact-pattern: frontend/dist-electron/*arm64*.exe

          - name: linux-x64
            os: ubuntu-latest
            script: dist:linux
            artifact-name: PhotoRAG-Linux-x64
            artifact-pattern: frontend/dist-electron/*.AppImage
            install-fuse: true

          - name: linux-arm64
            os: ubuntu-latest
            script: dist:linux:arm64
            artifact-name: PhotoRAG-Linux-arm64
            artifact-pattern: frontend/dist-electron/*.AppImage
            install-fuse: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: matrix.install-fuse
        run: sudo apt-get install -y libfuse2

      - run: npm ci
        working-directory: frontend

      - run: npm run ${{ matrix.script }}
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          retention-days: 30

      - if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: gh release upload ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }} ${{ matrix.artifact-pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
