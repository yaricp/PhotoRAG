name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --require ./scripts/crypto-polyfill.cjs ./node_modules/.bin/vitest run

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/ -v

  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download universal Python runtime
        run: bash scripts/download-python.sh

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and package DMG
        working-directory: frontend
        run: npm run dist:mac

      - name: Verify bundle structure
        run: bash scripts/test-bundle-structure.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRAG-macOS
          path: frontend/dist-electron/*.dmg
          retention-days: 14
