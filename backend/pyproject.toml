[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "einops>=0.8.2",
    "exifread>=3.5.1",
    "fastapi>=0.136.1",
    "geopy>=2.4.1",
    "huey==2.5.0",
    "imagehash>=4.3.2",
    "langchain>=1.2.15",
    "langchain-core>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.1.9",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "open-clip-torch>=3.3.0",
    "pillow>=12.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.32.0",
    "sentence-transformers>=5.4.1",
    "sqlalchemy>=2.0.49",
    "sqlite-vec>=0.1.9",
    "torch>=2.11.0",
    "transformers>=5.6.2",
    "uvicorn>=0.46.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.coverage.run]
source = ["src"]
omit = ["src/tasks/*", "src/queues/*"]
