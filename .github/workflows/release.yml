name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GitHub's GITHUB_TOKEN cannot authorize release creation when the target includes workflow changes.
          # Configure this repository secret with a fine-grained token scoped to this repo,
          # granting Contents, Pull requests, and Workflows write permissions.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
